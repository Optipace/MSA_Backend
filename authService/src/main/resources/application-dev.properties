spring.application.name=authService

# ===========================
# Eureka Client Configuration
# ===========================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${server.port}

server.port=0
server.address=0.0.0.0

# =================================
# PostgreSQL database configuration
# =================================
spring.datasource.url=jdbc:postgresql://localhost:5432/msadb?currentSchema=security
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================
# Hibernate settings
# ===================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.default_schema=security

app.jwt.secret=${JWT_SECRET}
app.login.fixed-password=abc@123
app.jwt.expiration-access=900000000
app.jwt.expiration-refresh=86400000